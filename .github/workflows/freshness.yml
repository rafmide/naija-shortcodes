name: Data freshness

# A wrong USSD code that moves money is a trust-killer. This fails weekly once any entry
# goes unverified for more than 90 days, which notifies the maintainers to re-check it.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:freshness
